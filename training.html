<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainingsplan SV Wacker 09</title>
<style>
  :root {
    --bg:#fbfbfa; --fg:#1c1b19; --matt:#6b6862; --linie:#e2ded6; --akzent:#146b3a;
    --karte:#fff; --raster:#f3f1ec; --warn:#a8541b; --warnbg:#fdf3e8;
    --s0:#4c9a2a; --s1:#1f8b74; --s2:#2f7cb5; --s3:#4b5fc0;
    --s4:#7a52b3; --s5:#a8447a; --s6:#b5561f; --s7:#8a6d1f;
    --b0:#eaf5e2; --b1:#e0f2ee; --b2:#e3eff8; --b3:#e8eafb;
    --b4:#f0eafa; --b5:#fae8f1; --b6:#fbeade; --b7:#f7f0dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#17181a; --fg:#e9e7e3; --matt:#9b978f; --linie:#2e3033; --akzent:#4caf7d;
      --karte:#1f2123; --raster:#232527; --warn:#e0a06a; --warnbg:#2a2119;
      --s0:#7cc95a; --s1:#4fbfa6; --s2:#68aae0; --s3:#8b9bf0;
      --s4:#b08de6; --s5:#e07cb0; --s6:#e58a52; --s7:#c9a94e;
      --b0:#22301c; --b1:#17302b; --b2:#1a2a38; --b3:#20233a;
      --b4:#2b2338; --b5:#361f2c; --b6:#372317; --b7:#312a15;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:1.8rem 1.25rem 3rem; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:78rem; margin:0 auto; }
  h1 { font-size:1.35rem; margin:0 0 .15rem; letter-spacing:-.01em; }
  .unter { color:var(--matt); margin:0 0 1.2rem; font-size:.88rem; }

  .leiste { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.5rem; }
  .knopf { border:1px solid var(--linie); background:var(--karte); color:var(--fg);
           border-radius:6px; padding:.3rem .7rem; font:inherit; font-size:.88rem; cursor:pointer; }
  .knopf:hover:not(:disabled) { border-color:var(--matt); }
  .knopf:disabled { opacity:.35; cursor:default; }
  .knopf[aria-pressed="true"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  select { font:inherit; font-size:.95rem; padding:.25rem; background:var(--karte);
           color:var(--fg); border:1px solid var(--linie); border-radius:6px; max-width:15rem; }
  .lage { font-size:.78rem; padding:.15rem .55rem; border-radius:999px;
          border:1px solid var(--linie); color:var(--matt); }
  .lage.sommer { color:var(--s0); border-color:var(--s0); }
  /* AM BILDSCHIRM IST DIE AUSWAHL DIE UEBERSCHRIFT. Auf Papier gibt es sie
     nicht -- dort tritt .gedruckt an ihre Stelle, sonst haengt ein Aushang
     ohne Woche an der Tuer. */
  .gedruckt { display:none; font-size:1.05rem; font-weight:600; }
  .hinweis { color:var(--matt); font-size:.85rem; margin:0 0 1.1rem; }

  .platz { margin-bottom:1.2rem; }
  .platz h2 { font-size:.8rem; margin:0 0 .3rem; letter-spacing:.06em;
              text-transform:uppercase; color:var(--matt); font-weight:600; }
  .gitter { display:grid; grid-template-columns:3.1rem repeat(5,1fr); gap:2px;
            background:var(--linie); border:1px solid var(--linie); border-radius:8px;
            overflow:hidden; }
  .kopfzelle { background:var(--raster); font-size:.78rem; color:var(--matt);
               padding:.25rem .4rem; text-align:center; font-weight:600; }
  .achse, .tag { background:var(--karte); position:relative; }
  .achse { }
  .achse span { position:absolute; right:.35rem; font-size:.7rem; color:var(--matt);
                transform:translateY(-.5em); font-variant-numeric:tabular-nums; }
  .strich { position:absolute; left:0; right:0; border-top:1px solid var(--raster); }
  .block { position:absolute; border-radius:5px; padding:.15rem .3rem; overflow:hidden;
           font-size:.78rem; font-weight:600; line-height:1.15; cursor:default; }
  .block .art { display:block; font-size:.66rem; font-weight:400; opacity:.75; }
  .block.ganz { font-weight:700; }
  .block.stern::after { content:"★"; position:absolute; top:.05rem; right:.2rem;
                        font-size:.6rem; opacity:.9; }
  .block.warn { outline:2px solid var(--warn); outline-offset:-2px; }

  .legende { background:var(--karte); border:1px solid var(--linie); border-radius:8px;
             padding:.7rem .9rem; font-size:.8rem; color:var(--matt); margin:1.2rem 0; }
  .legende b { color:var(--fg); }
  .marken { display:flex; flex-wrap:wrap; gap:.35rem .8rem; margin:.4rem 0 .6rem; }
  .marke { display:inline-flex; align-items:center; gap:.3rem; }
  .punkt { width:.85rem; height:.85rem; border-radius:3px; display:inline-block; }

  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--linie); padding:.28rem .5rem; text-align:left;
           font-size:.84rem; vertical-align:top; }
  thead th { font-size:.74rem; color:var(--matt); background:var(--raster); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .rahmen { background:var(--karte); border:1px solid var(--linie); border-radius:8px;
            overflow-x:auto; }
  .mannschaft h3 { font-size:1rem; margin:0 0 .1rem; }
  .mannschaft .sub { color:var(--matt); font-size:.82rem; margin:0 0 .7rem; }
  .fuss { color:var(--matt); font-size:.78rem; border-top:1px solid var(--linie);
          padding-top:.8rem; margin-top:1.6rem; }
  .fuss ul { margin:.3rem 0 0; padding-left:1.1rem; }

  @media print {
    @page { size:A4 landscape; margin:8mm; }
    body { padding:0; background:#fff; color:#000; font-size:9.5pt; }
    .leiste .knopf, .leiste select { display:none; }
    .gedruckt { display:inline; }
    .platz, .legende { break-inside:avoid; }
    .gitter { border-color:#999; }
  }
</style>
</head>

<main>
  <h1>Trainingsplan SV&nbsp;Wacker&nbsp;09 Cottbus-Ströbitz</h1>
  <p class="unter">Wochenbelegung der drei Plätze, Montag bis Freitag 16:30–21:30.</p>

  <div class="leiste">

    <button class="knopf" id="vor" title="Woche vor">›</button>
    <button class="knopf" id="heute">heute</button>
    <span class="gedruckt" id="gedruckt"></span>
    <span class="lage" id="lage"></span>
    <span style="flex:1"></span>
    <button class="knopf" id="sichtPlatz" aria-pressed="true">Plätze</button>
    <button class="knopf" id="sichtTeam" aria-pressed="false">Mannschaft</button>
    <select id="teamwahl" hidden></select>
  </div>
  <p class="hinweis" id="hinweis"></p>

  <div id="platzsicht"></div>
  <div id="teamsicht" hidden></div>

  <div class="legende" id="legende"></div>
  <div class="fuss" id="fuss"></div>
</main>

  const do_ = new Date(heute);
  do_.setDate(heute.getDate() + 3 - ((heute.getDay() + 6) % 7));
  const erster = new Date(do_.getFullYear(), 0, 4);
  const kw = 1 + Math.round(((do_ - erster) / 86400000 - 3 + ((erster.getDay() + 6) % 7)) / 7);
  const gesucht = `${do_.getFullYear()}-KW${String(kw).padStart(2,"0")}`;
  const treffer = DATEN.wochen.findIndex(w => w.kennung === gesucht);
  return treffer >= 0 ? treffer : 0;
}

function planVon(w) { return DATEN.plaene[w.lage]; }
function markeVon(w, i) { return w.marken[i] || null; }

function bloeckeAlsPlatz(w, platz) {
  const plan = planVon(w);
  const lanes = plan.spalten.filter(s => s.split("·")[0] === platz);
  if (!lanes.length) return null;
  const kasten = document.createElement("section");
  kasten.className = "platz";
  const h2 = document.createElement("h2");
  h2.textContent = PLATZNAME[platz] + " · " + lanes.join(" ¦ ");
  kasten.appendChild(h2);

  const gitter = document.createElement("div");
  gitter.className = "gitter";
  gitter.appendChild(Object.assign(document.createElement("div"),
    { className:"kopfzelle", textContent:"" }));
  TAGE.forEach((tag, n) => gitter.appendChild(Object.assign(document.createElement("div"),
    { className:"kopfzelle", textContent: `${tag} ${w.tage[n]}` })));

  const achse = document.createElement("div");
  achse.className = "achse";
  achse.style.height = HOEHE + "px";
  for (let min = VON; min <= BIS; min += 60) {
    const s = document.createElement("span");
    s.style.top = px(min) + "px";
    s.textContent = uhr(min);
    achse.appendChild(s);
  }
  gitter.appendChild(achse);

  TAGE.forEach((_, tag) => {
    const zelle = document.createElement("div");
    zelle.className = "tag";
    zelle.style.height = HOEHE + "px";
    for (let min = VON + 30; min < BIS; min += 60) {
      const linie = document.createElement("div");
      linie.className = "strich";
      linie.style.top = px(min + 30) + "px";
      zelle.appendChild(linie);
    }
    plan.bloecke.forEach((b, i) => {
      if (b.platz !== platz || b.tag !== tag) return;
      const marke = markeVon(w, i);
      const kachel = document.createElement("div");
      const erste = Math.min(...b.halbe.map(h => lanes.indexOf(h)));
      const breite = b.halbe.length / lanes.length * 100;
      kachel.className = "block s" + b.stufe + (b.ganz ? " ganz" : "")
        + (marke ? " stern" : "")
        + (marke && (marke.zustand === "belegt" || marke.eng) ? " warn" : "");
      kachel.style.cssText = `top:${px(b.von)}px;height:${px(b.bis)-px(b.von)-2}px;`
        + `left:${erste/lanes.length*100}%;width:calc(${breite}% - 3px);`
        + `background:var(--b${b.stufe});border-left:3px solid var(--s${b.stufe});`;
      kachel.textContent = b.team + (b.ganz ? " ⬛" : "");
      kachel.title = titelText(b, marke);
      zelle.appendChild(kachel);
    });
    gitter.appendChild(zelle);
  });
  kasten.appendChild(gitter);
  return kasten;
}

function titelText(b, marke) {
  const teile = [`${b.team} · ${b.zeit} · ${b.halbe.join(" + ")}`];
  if (b.ganz) teile.push("ganzer Platz");
  else if (b.allein > 0) teile.push(`die letzten ${b.allein} Minuten allein auf dem Platz`);
  else teile.push("teilt den Platz durchgehend");
  if (marke) {
    teile.push(`letzte Einheit vor dem Spiel am ${marke.spieltag} ${marke.datum} (${marke.art})`);
    if (marke.zustand === "tauschen") teile.push("→ besser auf " + marke.tausch);
    if (marke.zustand === "belegt") teile.push("→ " + marke.tausch + " ist belegt");
    if (marke.eng) teile.push(`nur ${marke.abstand} Tag bis zum Spiel`);
  }
  return teile.join(" · ");
}

function zeigePlatz(w) {
  const ziel = el("platzsicht");
  ziel.textContent = "";
  ["KR", "C", "A"].forEach(platz => {
    const kasten = bloeckeAlsPlatz(w, platz);
    if (kasten) ziel.appendChild(kasten);
  });
}

function zeigeTeam(w) {
  const ziel = el("teamsicht");
  ziel.textContent = "";
  const plan = planVon(w);
  const eintrag = plan.teams.find(x => x.team === team) || plan.teams[0];
  if (!eintrag) return;
  const kasten = document.createElement("div");
  kasten.className = "mannschaft";
  const h3 = document.createElement("h3");
  h3.innerHTML = `<span class="punkt" style="background:var(--s${eintrag.stufe})"></span> ${eintrag.team}`;
  kasten.appendChild(h3);
  const sub = document.createElement("p");
  sub.className = "sub";
  sub.textContent = `${eintrag.stufenname} · ${eintrag.bloecke.length} Einheiten · ${eintrag.dauer}`;
  kasten.appendChild(sub);

  const rahmen = document.createElement("div");
  rahmen.className = "rahmen";
  const tab = document.createElement("table");
  const kopf = tab.createTHead().insertRow();
  ["Tag","Zeit","Platz","Ganzer Platz",""].forEach(x => {
    const th = document.createElement("th"); th.textContent = x; kopf.appendChild(th); });
  const koerper = tab.createTBody();
  eintrag.bloecke.forEach(i => {
    const e = plan.bloecke[i];
    const tr = koerper.insertRow();
    const ganz = e.ganz ? "ganz" : (e.allein > 0 ? `letzte ${e.allein}′` : "geteilt");
    [`${TAGE[e.tag]} ${w.tage[e.tag]}`, e.zeit, e.halbe.join(" + "), ganz,
     markeVon(w, i) ? "★ letzte vor dem Spiel" : ""].forEach((wert, n) => {
      const td = tr.insertCell(); td.textContent = wert;
      if (n === 4 && wert) td.style.color = "var(--matt)";
    });
  });
  rahmen.appendChild(tab);
  kasten.appendChild(rahmen);

  const s = w.spiele.find(x => x.team === eintrag.team) || null;
  const p = document.createElement("p");
  p.className = "sub";
  p.style.marginTop = ".7rem";
  if (!s) {
    p.textContent = "Kein Spiel in den kommenden zwei Wochen.";
  } else {
    const befund = { passt:"Platzart passt.", tauschen:"Besser auf " + s.tausch + " — dort ist frei.",
                     belegt: s.tausch + " wäre richtig, ist aber belegt.",
                     offen:"Platzart des Spiels unbekannt." }[s.zustand];
    p.innerHTML = `<b>Nächstes Spiel:</b> ${s.tag} ${s.datum} ${s.zeit} `
      + `${s.heim ? "gegen" : "bei"} ${s.gegner} · ${s.art}. `
      + `Letzte Einheit ${s.einheit} auf ${s.flaeche} — ${befund} `
      + `Abstand ${s.abstand} Tag${s.abstand === 1 ? "" : "e"}.`;
    if (s.eng) p.innerHTML += " <b style='color:var(--warn)'>Kein freier Tag dazwischen.</b>";
  }
  kasten.appendChild(p);
  ziel.appendChild(kasten);
}

function baueLegende(w) {
  const farben = [...new Set(planVon(w).bloecke.map(b => b.stufe))].sort((a,b) => a-b);
  const marken = farben.map(s =>
    `<span class="marke"><span class="punkt" style="background:var(--s${s})"></span>${STUFEN[s]}</span>`).join("");
  el("legende").innerHTML =
    `<div class="marken">${marken}</div>`
    + `<div><b>⬛</b> ganzer Platz (beide Hälften) · <b>★</b> letzte Einheit vor dem Spiel — `
    + `nur dieser Block richtet sich nach der Platzart · <b>farbiger Rahmen</b> die Platzart `
    + `passt nicht und die Zielfläche ist belegt.</div>`
    + `<div style="margin-top:.4rem"><b>Wo wer liegt:</b> C-Jugend und älter (Großfeld) auf dem `
    + `Kunstrasen, G bis D auf dem Kleinfeldrasen. Deshalb beginnt die C-Jugend früher als die `
    + `D-Jugend — der Platz geht hier vor der Altersstaffelung.</div>`
    + `<div style="margin-top:.4rem">Zeiten stehen an der Achse links. Einzelheiten zu einem `
    + `Block: darauf zeigen. Alles zu einer Mannschaft: oben rechts auf <b>Mannschaft</b>.</div>`;
}

function baueFuss() {
  const p = DATEN.probe, ww = p.wunsch_winter, ws = p.wunsch_sommer;
  const datum = DATEN.stand ? DATEN.stand.slice(0,10).split("-").reverse().join(".") : "—";
  el("fuss").innerHTML =
    `<div>Spielplan vom ${datum} · ${DATEN.spiele_gesamt} Spiele (Heim und Auswärts) von fussball.de. `
    + `Winter ${p.winter.verbrauch} von ${p.winter.kapazitaet} Halbplatz-Stunden, `
    + `Sommer ${p.sommer.verbrauch} von ${p.sommer.kapazitaet}.</div>`
    + `<div>Wunsch Kunstrasen: <b>${ww.auf_kr} von ${ww.grossfeld}</b> Großfeld-Einheiten liegen auf `
    + `KR oder A-Platz. Wunsch ganzer Platz zum Schluss: <b>${ww.ganzplatz}</b> Einheiten haben ihn `
    + `ganz (Sommer ${ws.ganzplatz}).</div>`
    + `<ul>${p.winter.hinweise.filter(h => h.includes("freier Tag"))
        .map(h => `<li>${h} — unvermeidbar: drei Einheiten zwischen Montag und Donnerstag.</li>`).join("")}</ul>`;
}

function zeige(i) {
  if (i < 0 || i >= DATEN.wochen.length) return;
  stelle = i;
  const w = DATEN.wochen[i];
  el("wochenwahl").value = i;
  el("zurueck").disabled = i === 0;
  el("vor").disabled = i === DATEN.wochen.length - 1;
  el("gedruckt").textContent = `${w.kennung} · ${w.titel}`;
  el("lage").textContent = w.lage;
  el("lage").className = "lage " + w.lage.toLowerCase();
  el("hinweis").textContent = w.hinweis;

  const wahl = el("teamwahl");
  if (wahl.dataset.gefuellt !== "ja") {
    planVon(w).teams.forEach(x => {
      const o = document.createElement("option");
      o.value = x.team; o.textContent = x.team;
      wahl.appendChild(o);
    });
    wahl.dataset.gefuellt = "ja";
    team = planVon(w).teams[0] ? planVon(w).teams[0].team : null;
  }
  wahl.value = team;

  el("platzsicht").hidden = sicht !== "platz";
  el("teamsicht").hidden = sicht !== "team";
  el("teamwahl").hidden = sicht !== "team";
  el("sichtPlatz").setAttribute("aria-pressed", sicht === "platz");
  el("sichtTeam").setAttribute("aria-pressed", sicht === "team");
  if (sicht === "platz") zeigePlatz(w); else zeigeTeam(w);
  baueLegende(w);
}

DATEN.wochen.forEach((w, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = `${w.kennung} · ${w.titel}`;
  el("wochenwahl").appendChild(o);
});
el("wochenwahl").addEventListener("change", e => zeige(+e.target.value));
el("zurueck").addEventListener("click", () => zeige(stelle - 1));
el("vor").addEventListener("click", () => zeige(stelle + 1));
el("heute").addEventListener("click", () => zeige(heuteStelle()));
el("sichtPlatz").addEventListener("click", () => { sicht = "platz"; zeige(stelle); });
el("sichtTeam").addEventListener("click", () => { sicht = "team"; zeige(stelle); });
el("teamwahl").addEventListener("change", e => { team = e.target.value; zeige(stelle); });
baueFuss();
zeige(heuteStelle());
</script>
</body>
</html>
