<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainingsplan SV Wacker 09</title>
<style>

          --ton-kr:#3f7d55; --ton-c:#94601f; --ton-a:#3a6ea5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181a; --fg:#e9e7e3; --matt:#9b978f; --linie:#2e3033; --akzent:#4caf7d;
            --karte:#1f2123; --raster:#232527; --warn:#e0a06a; --warnbg:#2a2119;
            --ton-kr:#69b489; --ton-c:#d59f5c; --ton-a:#74a6dd; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:2rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:74rem; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 .2rem; letter-spacing:-.01em; }
  .unter { color:var(--matt); margin:0 0 1.4rem; font-size:.9rem; }
  a { color:var(--akzent); }

  .kopf { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:.6rem; }
  /* AM BILDSCHIRM IST DIE AUSWAHL DIE UEBERSCHRIFT. Auf Papier gibt es sie
     nicht -- dort tritt .gedruckt an ihre Stelle, sonst haengt ein Aushang
     ohne Woche an der Tuer. */
  .gedruckt { display:none; font-size:1.1rem; font-weight:600; }
  .knopf { border:1px solid var(--linie); background:var(--karte); color:var(--fg);
           border-radius:6px; padding:.3rem .7rem; font:inherit; cursor:pointer; }
  .knopf:hover:not(:disabled) { border-color:var(--matt); }
  .knopf:disabled { opacity:.35; cursor:default; }
  #wochenwahl { font:inherit; font-size:1.05rem; max-width:min(100%,20rem);
                padding:.25rem; background:var(--karte); color:var(--fg);
                border:1px solid var(--linie); border-radius:6px; }
  .lage { font-size:.8rem; padding:.15rem .55rem; border-radius:999px;
          border:1px solid var(--linie); color:var(--matt); }
  .lage.sommer { color:var(--ton-kr); border-color:var(--ton-kr); }
  .hinweis { color:var(--matt); font-size:.87rem; margin:0 0 1.3rem; }

  .platz { margin-bottom:1.5rem; }
  .platz h2 { font-size:.95rem; margin:0 0 .35rem; letter-spacing:.02em;
              text-transform:uppercase; color:var(--matt); }
  .platz.kr h2 { color:var(--ton-kr); } .platz.c h2 { color:var(--ton-c); }
  .platz.a h2 { color:var(--ton-a); }
  .rahmen { background:var(--karte); border:1px solid var(--linie);
            border-radius:10px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:46rem; }
  th, td { border-bottom:1px solid var(--linie); padding:.3rem .5rem;
           text-align:left; vertical-align:top; font-size:.87rem; }
  tr:last-child td { border-bottom:none; }
  thead th { font-size:.78rem; color:var(--matt); font-weight:600;
             background:var(--raster); white-space:nowrap; }
  td.zeit, th.zeit { white-space:nowrap; color:var(--matt); font-variant-numeric:tabular-nums;
                     width:6.6rem; }
  .leer { color:var(--linie); }

  .chip { display:inline-block; border:1px solid var(--linie); border-radius:6px;
          padding:.1rem .4rem; margin:.1rem .15rem .1rem 0; background:var(--bg);
          white-space:nowrap; }
  .chip.ganz { border-color:var(--matt); font-weight:600; }
  .chip.warn { background:var(--warnbg); border-color:var(--warn); color:var(--warn); }
  .chip.tausch { border-color:var(--ton-a); color:var(--ton-a); }
  .chip.tausch .vor { color:var(--ton-a); }
  .chip .vor { font-size:.72rem; color:var(--matt); display:block; }
  .chip.warn .vor { color:var(--warn); }

  .vorbereitung { background:var(--karte); border:1px solid var(--linie);
                  border-radius:10px; overflow-x:auto; margin-bottom:1.5rem; }
  .fuss { color:var(--matt); font-size:.8rem; border-top:1px solid var(--linie);
          padding-top:.9rem; margin-top:2rem; }
  .fuss ul { margin:.4rem 0 0; padding-left:1.1rem; }

  @media print {
    @page { size:A4 landscape; margin:10mm; }
    body { padding:0; background:#fff; color:#000; font-size:10pt; }
    .kopf .knopf, #wochenwahl { display:none; }
    .gedruckt { display:inline; }
    .rahmen, .vorbereitung { overflow:visible; border-color:#999; }
    table { min-width:0; }
    .platz { break-inside:avoid; }
    .fuss { break-before:avoid; }
  }
</style>
</head>

const TAGE = ["Mo","Di","Mi","Do","Fr"];
let stelle = 0;

const el = (id) => document.getElementById(id);
const text = (s) => document.createTextNode(s);

function baueWahl() {
  const wahl = el("wochenwahl");
  DATEN.wochen.forEach((w, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `${w.kennung} · ${w.titel}`;
    wahl.appendChild(o);
  });
  wahl.addEventListener("change", () => zeige(+wahl.value));
  el("zurueck").addEventListener("click", () => zeige(stelle - 1));
  el("vor").addEventListener("click", () => zeige(stelle + 1));
  el("heute").addEventListener("click", () => zeige(heuteStelle()));
}

/* Die laufende Woche, nicht die erste: der Aushang haengt mitten in der
   Saison, und wer ihn oeffnet, will diese Woche sehen. */
function heuteStelle() {
  const heute = new Date();
  const jahr = heute.getFullYear();
  const donnerstag = new Date(heute);
  donnerstag.setDate(heute.getDate() + 3 - ((heute.getDay() + 6) % 7));
  const erster = new Date(donnerstag.getFullYear(), 0, 4);
  const kw = 1 + Math.round(((donnerstag - erster) / 86400000
             - 3 + ((erster.getDay() + 6) % 7)) / 7);
  const gesucht = `${donnerstag.getFullYear()}-KW${String(kw).padStart(2,"0")}`;
  const treffer = DATEN.wochen.findIndex(w => w.kennung === gesucht);
  return treffer >= 0 ? treffer : 0;
}

const ZEICHEN = { passt:"✓", tauschen:"⇄", eng:"⚠", offen:"·" };

/* Der Platzart-Block ist die letzte Einheit vor dem Spiel -- der einzige,
   der sich nach dem Untergrund richtet. "tauschen" heisst: die Zielflaeche
   ist zu dieser Zeit frei. "belegt" heisst: sie ist es nicht, der Block
   bleibt stehen. Ein Vorschlag, der nicht geht, waere schlimmer als keiner. */
function chip(eintrag) {
  const span = document.createElement("span");
  span.className = "chip" + (eintrag.ganz ? " ganz" : "");
  span.appendChild(text(eintrag.team + (eintrag.ganz ? " ⬛" : "")));
  const marke = eintrag.marke;
  if (marke) {
    if (marke.zustand === "tauschen") span.className += " tausch";
    if (marke.zustand === "eng" || marke.eng) span.className += " warn";
    const vor = document.createElement("span");
    vor.className = "vor";
    let zeile = `→ ${marke.spieltag} ${marke.datum} · ${marke.art} ${ZEICHEN[marke.zustand]}`;
    if (marke.zustand === "tauschen") zeile += ` ${marke.tausch}`;
    if (marke.zustand === "eng") zeile += ` ${marke.tausch} belegt`;
    if (marke.eng) zeile += ` · nur ${marke.abstand} Tag${marke.abstand === 1 ? "" : "e"}`;
    vor.textContent = zeile;
    span.appendChild(vor);
    span.title = {
      passt: "Letzte Einheit vor dem Spiel — der Untergrund passt.",
      tauschen: "Letzte Einheit vor dem Spiel — Untergrund passt nicht, die Zielfläche ist frei.",
      eng: "Letzte Einheit vor dem Spiel — Untergrund passt nicht, die Zielfläche ist belegt.",
      offen: "Letzte Einheit vor dem Spiel — Platzart des Spiels unbekannt, keine Bindung."
    }[marke.zustand];
  }
  return span;
}

function zeige(i) {
  if (i < 0 || i >= DATEN.wochen.length) return;
  stelle = i;
  const w = DATEN.wochen[i];
  el("wochenwahl").value = i;
  el("zurueck").disabled = i === 0;
  el("vor").disabled = i === DATEN.wochen.length - 1;
  el("gedruckt").textContent = `${w.kennung} · ${w.titel}`;
  el("lage").textContent = w.lage;
  el("lage").className = "lage " + w.lage.toLowerCase();
  el("hinweis").textContent = w.hinweis;

  const ziel = el("plaetze");
  ziel.textContent = "";
  w.plaetze.forEach(platz => {
    const kasten = document.createElement("section");
    kasten.className = "platz " + platz.kurz.toLowerCase();
    const h2 = document.createElement("h2");
    h2.textContent = platz.titel + (platz.geteilt ? " · zwei Hälften" : " · ganz");
    kasten.appendChild(h2);

    const rahmen = document.createElement("div");
    rahmen.className = "rahmen";
    const tabelle = document.createElement("table");
    const kopf = tabelle.createTHead().insertRow();
    const zelle0 = document.createElement("th");
    zelle0.className = "zeit"; zelle0.textContent = "Zeit";
    kopf.appendChild(zelle0);
    TAGE.forEach((tag, n) => {
      const th = document.createElement("th");
      th.textContent = `${tag} ${w.tage[n]}`;
      kopf.appendChild(th);
    });
    const koerper = tabelle.createTBody();
    platz.zeilen.forEach(zeile => {
      const tr = koerper.insertRow();
      const zeit = tr.insertCell();
      zeit.className = "zeit";
      zeit.textContent = `${zeile.von}–${zeile.bis}`;
      zeile.zellen.forEach(eintraege => {
        const td = tr.insertCell();
        if (!eintraege.length) { td.className = "leer"; td.textContent = "–"; return; }
        eintraege.forEach(e => td.appendChild(chip(e)));
      });
    });
    rahmen.appendChild(tabelle);
    kasten.appendChild(rahmen);
    ziel.appendChild(kasten);
  });

  const spiele = el("spiele");
  spiele.textContent = "";
  if (!w.spiele.length) {
    spiele.innerHTML = '<p style="padding:.7rem;margin:0;color:var(--matt)">' +
      'Kein Spiel in den kommenden zwei Wochen.</p>';
  } else {
    const tabelle = document.createElement("table");
    const kopf = tabelle.createTHead().insertRow();
    ["Mannschaft","Spiel","H/A","Gegner","Platzart","Letzte Einheit","Fläche","Abstand","Befund"]
      .forEach(t => { const th = document.createElement("th"); th.textContent = t; kopf.appendChild(th); });
    const koerper = tabelle.createTBody();
    w.spiele.forEach(s => {
      const tr = koerper.insertRow();
      const befund = {
        passt: "✓ Platzart passt",
        tauschen: "⇄ tauschen auf " + s.tausch,
        eng: "⚠ " + s.tausch + " belegt — bleibt",
        offen: "· Platzart unbekannt"
      }[s.zustand];
      [s.team, `${s.tag} ${s.datum} ${s.zeit}`, s.heim ? "H" : "A", s.gegner,
       s.art, s.einheit, s.flaeche,
       `${s.abstand} Tag${s.abstand === 1 ? "" : "e"}`, befund].forEach((wert, n) => {
        const td = tr.insertCell();
        td.textContent = wert;
        if (n === 7 && s.eng) { td.style.color = "var(--warn)"; td.style.fontWeight = "600"; }
        if (n === 8) {
          td.style.whiteSpace = "nowrap";
          if (s.zustand === "eng") td.style.color = "var(--warn)";
          if (s.zustand === "tauschen") td.style.color = "var(--ton-a)";
        }
      });
    });
    spiele.appendChild(tabelle);
  }
}

function baueFuss() {
  const p = DATEN.probe;
  const zeilen = [
    `Stand des Spielplans: ${DATEN.stand ? DATEN.stand.slice(0,10).split("-").reverse().join(".") : "—"} · ` +
    `${DATEN.spiele_gesamt} Spiele (Heim und Auswärts) von fussball.de.`,
    `Winter: ${p.winter.bloecke} Blöcke, ${p.winter.verbrauch} von ${p.winter.kapazitaet} Halbplatz-Stunden. ` +
    `Sommer: ${p.sommer.bloecke} Blöcke, ${p.sommer.verbrauch} von ${p.sommer.kapazitaet}.`,
    "Spieltage (gemessen): " + Object.entries(DATEN.spieltage).map(([k,v]) => `${k} ${v}`).join(" · ") + ".",
  ];
  el("fuss").innerHTML = zeilen.map(z => `<div>${z}</div>`).join("") +
    `<ul>${p.winter.hinweise.filter(h => h.includes("freier Tag"))
      .map(h => `<li>${h} — unvermeidbar: drei Einheiten zwischen Montag und Donnerstag.</li>`).join("")}</ul>`;
}

el("stand").textContent = "";
baueWahl();
baueFuss();
zeige(heuteStelle());
</script>
</body>
</html>
