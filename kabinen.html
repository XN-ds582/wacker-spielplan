<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabinenbelegung SV Wacker 09</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1c1b19; --matt:#6b6862; --linie:#e2ded6; --akzent:#146b3a;
          --karte:#fff; --raster:#efece6; --warn:#a8541b; --warnbg:#fdf3e8;
          --ton-platz:#3f7d55; --ton-klein:#3a6ea5; --ton-gross:#94601f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181a; --fg:#e9e7e3; --matt:#9b978f; --linie:#2e3033; --akzent:#4caf7d;
            --karte:#1f2123; --raster:#232527; --warn:#e0a06a; --warnbg:#2a2119;
            --ton-platz:#69b489; --ton-klein:#74a6dd; --ton-gross:#d59f5c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:2rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 72rem; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 .2rem; letter-spacing:-.01em; }
  .unter { color:var(--matt); margin:0 0 1.5rem; font-size:.9rem; }

  .kopf { display:flex; gap:.7rem; align-items:baseline; flex-wrap:wrap; margin-bottom:1rem; }
  .kopf h2 { font-size:1.1rem; margin:0; }
  .kopf .zahl { color:var(--matt); font-size:.88rem; }
  .knopf { border:1px solid var(--linie); background:var(--karte); color:var(--fg);
           border-radius:6px; padding:.35rem .7rem; font:inherit; font-size:.85rem;
           cursor:pointer; }
  .knopf:hover:not(:disabled) { border-color:var(--matt); }
  .knopf:disabled { opacity:.35; cursor:default; }

  .plan { background:var(--karte); border:1px solid var(--linie); border-radius:10px;
          overflow-x:auto; padding:.6rem 0 .2rem; }
  .zeile { display:flex; align-items:stretch; min-height:1.9rem; }

  /* DREI GRUPPEN, DREI TOENE. Ein Band ueber die volle Breite trennt sie,
     der Farbstreifen am Schild bindet die Zeilen darunter daran. */
  .t-platz { --ton:var(--ton-platz); }
  .t-klein { --ton:var(--ton-klein); }
  .t-gross { --ton:var(--ton-gross); }
  .gruppenband { display:flex; align-items:center; margin:1.5rem 0 .35rem;
                 padding:.34rem 0; border-top:1px solid var(--ton);
                 border-bottom:1px solid var(--linie);
                 background:color-mix(in srgb, var(--ton) 10%, transparent);
                 print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  .kopfzeile + .gruppenband { margin-top:.2rem; }
  .gruppenband span { position:sticky; left:0; padding:0 .65rem; font-size:.72rem;
                      letter-spacing:.09em; text-transform:uppercase; font-weight:700;
                      color:var(--ton); white-space:nowrap; }
  .zeile[class*="t-"] .schild {
      box-shadow:inset 3px 0 0 color-mix(in srgb, var(--ton) 60%, transparent); }
  .schild { flex:0 0 11rem; padding:.25rem .6rem; font-size:.82rem; display:flex;
            align-items:center; gap:.4rem; border-right:1px solid var(--linie); }
  .schild b { font-weight:600; font-variant-numeric:tabular-nums; }
  .schild span { color:var(--matt); }
  .spur { position:relative; flex:1 0 auto; }
  .zeile:not(.gruppe) .spur { border-bottom:1px solid var(--raster);
    background-image:repeating-linear-gradient(to right,
      var(--raster) 0 1px, transparent 1px var(--stunde, 93px));
    background-position:var(--versatz, 0) 0; }
  .dusche .schild { border-bottom:2px solid var(--linie); }
  .dusche .spur { border-bottom:2px solid var(--linie); }

  .stunden { position:relative; height:1.4rem; }
  .stunde { position:absolute; top:0; padding-left:.25rem; font-size:.7rem;
            color:var(--matt); }

  .block { position:absolute; top:2px; bottom:2px; border-radius:4px; padding:0 .35rem;
           font-size:.74rem; line-height:1.55rem; white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; border:1px solid rgba(0,0,0,.12); }
  .block.gast { background-image:repeating-linear-gradient(135deg,
                 rgba(255,255,255,.55) 0 4px, transparent 4px 8px); }
  .block.schiri { background:var(--karte)!important; border:1px dashed var(--matt);
                  color:var(--matt); }
  .block.fest::after { content:" ●"; }

  .vermerke { margin-top:1rem; border:1px solid var(--linie); border-left:3px solid var(--warn);
              background:var(--warnbg); border-radius:8px; padding:.7rem .9rem; font-size:.85rem; }
  .vermerke h3 { margin:0 0 .35rem; font-size:.85rem; color:var(--warn); }
  .vermerke ul { margin:0; padding-left:1.1rem; }
  .leer { color:var(--matt); font-size:.85rem; margin-top:1rem; }

  /* Nur im Bearbeiten-Modus sichtbar. */
  .spur.ziel { background-color:color-mix(in srgb, var(--akzent) 14%, transparent); }
  .block[draggable="true"] { cursor:grab; }
  .stellwerk { margin-top:1rem; display:flex; flex-wrap:wrap; gap:.5rem 1.1rem;
               align-items:center; font-size:.84rem; }
  .stellwerk label { display:flex; align-items:center; gap:.35rem; }
  .fahne { display:inline-block; background:var(--akzent); color:#fff;
           border-radius:5px; padding:.1rem .45rem; font-size:.72rem;
           letter-spacing:.05em; text-transform:uppercase; }
  .melder { min-height:1.2rem; margin:.5rem 0 0; font-size:.83rem; color:var(--warn); }

  .fuss { margin-top:2rem; padding-top:1rem; border-top:1px solid var(--linie);
          color:var(--matt); font-size:.8rem; }

  @media print {
    @page { size:A4 landscape; margin:12mm; }
    body { padding:0; background:#fff; color:#000; }
    .knopf, .fuss { display:none; }
    .plan { border:1px solid #999; overflow:visible; }
    .block { border-color:#666; }
  }
</style>
</head>
<body>
<main>
  <h1>Kabinen- und Platzbelegung</h1>
  <p class="unter">SV Wacker 09 Cottbus-Ströbitz · Heimspiele · <span id="stand"></span></p>

  <div class="kopf">
    <button class="knopf" id="zurueck">‹ voriger</button>
    <h2 id="titel">—</h2>
    <span class="zahl" id="zahl"></span>
    <button class="knopf" id="vor">nächster ›</button>
    <button class="knopf" id="drucken">Drucken</button>
  </div>

  <div class="plan" id="plan"></div>
  <div class="stellwerk" id="stellwerk"></div>
  <p class="melder" id="melder"></p>
  <div id="hinweise"></div>

  <p class="fuss">Belegung ab Anstoß minus 60 Minuten bis 45 Minuten nach dem
    Abpfiff; Schiedsrichter ab minus 30. Pokalspiele halten Platz und Kabine
    45 Minuten länger frei — Verlängerung und Elfmeterschießen. ● heißt: von
    Hand gesetzt.</p>
</main>

<script>
// DIE DATEN STEHEN IN EINEM JSON-ELEMENT, NICHT IM SKRIPT. Ein Platzhalter
// mitten im Quelltext neben einem Vorgabewert ergibt beim Ersetzen zwei
// Objekte nebeneinander -- und eine Seite, die still leer bleibt.
let DATEN = JSON.parse(document.getElementById("daten").textContent);
// Im Bearbeiten-Modus liefert der Server unter 127.0.0.1 aus und nimmt jede
// Verschiebung als POST entgegen. Die veroeffentlichte Fassung ist dieselbe
// Datei ohne dieses Merkmal -- also zum Lesen und Drucken, nicht zum Schieben.
const BEARBEITEN = DATEN.bearbeiten === true;

// DIE ZEILEN STEHEN FEST, DIE HAELFTEN NICHT. Ein geteilter Platz bekommt
// nur dann zwei Zeilen, wenn an dem Tag auch wirklich zwei Spiele nebeneinander
// laufen -- sonst steht der Aushang voller leerer Zeilen.
const ZEILEN = [
  {gruppe: "Plätze", ton: "platz"},
  {raum:"A",  name:"A-Platz",  zusatz:"Rasen", nimmt:"platz"},
  {raum:"A·1", name:"A-Platz", zusatz:"Hälfte 1", wenn:"benutzt", nimmt:"platz"},
  {raum:"A·2", name:"A-Platz", zusatz:"Hälfte 2", wenn:"benutzt", nimmt:"platz"},
  {raum:"KR", name:"KR-Platz", zusatz:"Kunstrasen", nimmt:"platz"},

  {gruppe: "Kleines Gebäude · Erwachsene", ton: "klein"},
  {raum:"K1", name:"K1", nimmt:"kabine"}, {raum:"K2", name:"K2", dusche:true, nimmt:"kabine"},
  {raum:"K3", name:"K3", nimmt:"kabine"}, {raum:"K4", name:"K4", dusche:true, nimmt:"kabine"},
  {raum:"KS1", name:"KS1", zusatz:"Schiri", nimmt:"schiri"},
  {raum:"KS2", name:"KS2", zusatz:"Schiri", nimmt:"schiri"},
  {gruppe: "Großes Gebäude · Jugend", ton: "gross"},
  {raum:"G1", name:"G1", nimmt:"kabine"}, {raum:"G2", name:"G2", dusche:true, nimmt:"kabine"},
  {raum:"G3", name:"G3", nimmt:"kabine"}, {raum:"G4", name:"G4", dusche:true, nimmt:"kabine"},
  {raum:"G5", name:"G5", nimmt:"kabine"}, {raum:"G6", name:"G6", dusche:true, nimmt:"kabine"},
  {raum:"GS1", name:"GS1", zusatz:"Schiri", nimmt:"schiri"},
];

const TAGE = Object.keys(DATEN.tage).sort();
const WOCHENTAG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
let heute = TAGE.indexOf(DATEN.start || "");
if (heute < 0) heute = TAGE.findIndex(d => d >= new Date().toISOString().slice(0,10));
if (heute < 0) heute = Math.max(0, TAGE.length - 1);

const minuten = t => Number(t.slice(0,2)) * 60 + Number(t.slice(3,5));
const farbe = (kennung, art) => {
  // Eine Begegnung, ein Farbton -- Heim und Gast gehoeren sichtbar zusammen.
  let summe = 0;
  for (const z of kennung) summe = (summe * 31 + z.charCodeAt(0)) % 360;
  const dunkel = matchMedia("(prefers-color-scheme: dark)").matches;
  const licht = art === "platz" ? (dunkel ? 26 : 90) : (dunkel ? 30 : 84);
  return `hsl(${summe} ${art === "platz" ? 24 : 46}% ${licht}%)`;
};

// EINE ACHSE FUER ALLE TAGE. Vorher rechnete jeder Tag seinen eigenen
// Ausschnitt -- damit lag derselbe Anstoss an zwei Samstagen an verschiedenen
// Stellen, und wer blaettert, vergleicht Bilder, die nicht vergleichbar sind.
// Die Achse ist genau so breit wie die Saison: vom fruehesten Treffpunkt bis
// zum spaetesten Ende, Vor- und Nachlauf schon eingerechnet. Keine runden
// Vorgabewerte -- die schenken nur leeren Rand.
const ALLE = Object.values(DATEN.tage).flatMap(t => t.bloecke || []);
const VON = ALLE.length ? Math.min(...ALLE.map(b => minuten(b.von))) : 8 * 60;
const BIS = ALLE.length ? Math.max(...ALLE.map(b => minuten(b.bis))) : 22 * 60;

let druckt = false;

function melde(text) {
  const m = document.getElementById("melder");
  m.textContent = text;
  clearTimeout(melde.uhr);
  melde.uhr = setTimeout(() => { m.textContent = ""; }, 6000);
}

// JEDE VERSCHIEBUNG GEHT SOFORT AUF DIE PLATTE. Der Server rechnet den
// ganzen Plan neu und schickt ihn zurueck -- damit sieht man in derselben
// Sekunde, was die Verschiebung woanders ausloest (ein Gast, der dadurch
// kein Paar mehr findet, zum Beispiel).
async function speichern(wunsch) {
  try {
    const antwort = await fetch("/speichern", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(wunsch)});
    if (!antwort.ok) throw new Error("HTTP " + antwort.status);
    DATEN = await antwort.json();
    zeichnen();
  } catch (fehler) {
    melde("Nicht gespeichert: " + fehler.message);
  }
}

function zeichnen() {
  const datum = TAGE[heute];
  const tag = DATEN.tage[datum] || {bloecke: [], vermerke: []};
  const wann = new Date(datum + "T12:00:00");
  document.getElementById("titel").textContent =
    `${WOCHENTAG[wann.getDay()]}, ${wann.toLocaleDateString("de-DE")}`;
  document.getElementById("zahl").textContent =
    `${(tag.spiele || []).length} Heimspiele`;
  document.getElementById("zurueck").disabled = heute <= 0;
  document.getElementById("vor").disabled = heute >= TAGE.length - 1;

  const bloecke = tag.bloecke || [];
  const von = VON, bis = BIS;
  const plan = document.getElementById("plan");
  // Der Massstab folgt der Fensterbreite, damit die feste Achse ohne
  // Querscrollen hineinpasst -- gleich fuer jeden Tag, weil VON und BIS es sind.
  // BEIM DRUCKEN NICHT. Sonst entscheidet die zufaellige Fensterbreite, was
  // aufs Papier passt: ein schmales Fenster schiebt den Plan ueber den Rand.
  // A4 quer sind 297 mm, abzueglich 12 mm Rand je Seite = 273 mm ~ 1032 px.
  const platz = (druckt ? 1032 : plan.clientWidth) - 11 * 16 - 10;
  const proMinute = Math.min(2.2, Math.max(0.85, platz / (bis - von)));
  const breite = (bis - von) * proMinute;
  const links = m => (m - von) * proMinute;

  plan.innerHTML = "";
  plan.style.setProperty("--stunde", (60 * proMinute) + "px");
  // Die Achse beginnt auf einer halben Stunde -- die Rasterlinien muessen
  // trotzdem auf den vollen liegen, sonst zeigt die Beschriftung daneben.
  plan.style.setProperty("--versatz", (((60 - von % 60) % 60) * proMinute) + "px");

  // Stundenleiste
  const kopf = document.createElement("div");
  kopf.className = "zeile kopfzeile";
  kopf.innerHTML = `<div class="schild"></div>`;
  const leiste = document.createElement("div");
  leiste.className = "spur stunden";
  leiste.style.width = breite + "px";
  for (let m = Math.ceil(von / 60) * 60; m <= bis; m += 60) {
    const s = document.createElement("div");
    s.className = "stunde";
    s.style.left = links(m) + "px";
    s.textContent = String(m / 60).padStart(2, "0");
    leiste.appendChild(s);
  }
  kopf.appendChild(leiste);
  plan.appendChild(kopf);

  let ton = "";
  for (const zeile of ZEILEN) {
    if (zeile.gruppe) {
      ton = zeile.ton;
      const g = document.createElement("div");
      g.className = "gruppenband t-" + ton;
      g.style.width = `calc(11rem + ${breite}px)`;
      const s = document.createElement("span");
      s.textContent = zeile.gruppe;
      g.appendChild(s);
      plan.appendChild(g);
      continue;
    }
    const meine = bloecke.filter(b => b.raum === zeile.raum);
    if (zeile.wenn === "benutzt" && !meine.length) continue;

    const z = document.createElement("div");
    z.className = "zeile t-" + ton + (zeile.dusche ? " dusche" : "");
    z.innerHTML = `<div class="schild"><b>${zeile.name}</b>` +
                  (zeile.zusatz ? `<span>${zeile.zusatz}</span>` : "") + `</div>`;
    const spur = document.createElement("div");
    spur.className = "spur";
    spur.style.width = breite + "px";
    for (const b of meine) {
      const el = document.createElement("div");
      el.className = "block " + b.art + (b.fest ? " fest" : "");
      el.style.left = links(minuten(b.von)) + "px";
      el.style.width = Math.max(18, (minuten(b.bis) - minuten(b.von)) * proMinute - 3) + "px";
      if (b.art !== "schiri") el.style.background = farbe(b.kennung, b.art);
      el.textContent = b.text;
      el.title = `${b.text}\n${b.von}–${b.bis} · Anstoß ${b.anstoss}`;
      if (BEARBEITEN) {
        el.draggable = true;
        el.title += "\nZiehen verschiebt · Doppelklick nimmt die Handzuweisung zurück";
        el.addEventListener("dragstart", ev => {
          ev.dataTransfer.setData("text/plain",
            JSON.stringify({kennung: b.kennung, slot: b.slot}));
          ev.dataTransfer.effectAllowed = "move";
        });
        el.addEventListener("dblclick", () =>
          speichern({kennung: b.kennung, slot: b.slot, raum: null}));
      }
      spur.appendChild(el);
    }
    if (BEARBEITEN && zeile.nimmt) {
      spur.addEventListener("dragover", ev => {
        ev.preventDefault();
        spur.classList.add("ziel");
      });
      spur.addEventListener("dragleave", () => spur.classList.remove("ziel"));
      spur.addEventListener("drop", ev => {
        ev.preventDefault();
        spur.classList.remove("ziel");
        let w = {};
        try { w = JSON.parse(ev.dataTransfer.getData("text/plain") || "{}"); } catch (e) {}
        const passt = (w.slot === "platz" && zeile.nimmt === "platz")
          || (w.slot === "schiri" && zeile.nimmt === "schiri")
          || ((w.slot === "heim" || w.slot === "gast") && zeile.nimmt === "kabine");
        if (!passt) { melde("Das gehört nicht in diese Zeile."); return; }
        speichern({kennung: w.kennung, slot: w.slot, raum: zeile.raum});
      });
    }
    z.appendChild(spur);
    plan.appendChild(z);
  }

  stellwerk_zeichnen(datum, tag);

  const hinweise = document.getElementById("hinweise");
  hinweise.innerHTML = "";
  if ((tag.vermerke || []).length) {
    // KEIN innerHTML MIT FREMDEN NAMEN. Die Gegnernamen kommen von
    // fussball.de und die Seite steht spaeter oeffentlich -- ein "<" im
    // Vereinsnamen soll ein "<" bleiben, kein Element werden.
    const k = document.createElement("div");
    k.className = "vermerke";
    const h = document.createElement("h3");
    h.textContent = "Vermerke";
    const liste = document.createElement("ul");
    for (const v of tag.vermerke) {
      const li = document.createElement("li");
      const b = document.createElement("b");
      b.textContent = v.mannschaft;
      li.append(b, " — " + v.text);
      liste.appendChild(li);
    }
    k.append(h, liste);
    hinweise.appendChild(k);
  } else {
    const p = document.createElement("p");
    p.className = "leer";
    p.textContent = "Keine Ausnahme, kein Konflikt — der Tag geht nach Regel auf.";
    hinweise.appendChild(p);
  }
}

// DER SCHALTER FUER DIE SCHIEDSRICHTERIN GEHOERT HIERHIN, weil er nirgendwo
// sonst hinkann: fussball.de gibt die Namen des Gespanns nicht her.
function stellwerk_zeichnen(datum, tag) {
  const w = document.getElementById("stellwerk");
  w.innerHTML = "";
  if (!BEARBEITEN) return;
  const fahne = document.createElement("span");
  fahne.className = "fahne";
  fahne.textContent = "Bearbeiten";
  w.appendChild(fahne);

  for (const s of (tag.spiele || []).filter(s => s.gespann)) {
    const label = document.createElement("label");
    const kasten = document.createElement("input");
    kasten.type = "checkbox";
    kasten.checked = !!(DATEN.hand[s.kennung] || {}).schiedsrichterin;
    kasten.onchange = () => speichern(
      {kennung: s.kennung, schiedsrichterin: kasten.checked});
    label.append(kasten, `Schiedsrichterin im Gespann (${s.mannschaft})`);
    w.appendChild(label);
  }

  const knopf = document.createElement("button");
  knopf.className = "knopf";
  knopf.textContent = "Tag zurück auf Vorschlag";
  knopf.onclick = () => speichern({zuruecksetzen: true, tag: datum});
  w.appendChild(knopf);
}

document.getElementById("zurueck").onclick = () => { heute--; zeichnen(); };
document.getElementById("vor").onclick = () => { heute++; zeichnen(); };
document.getElementById("drucken").onclick = () => print();
// Der Druckdialog kommt auch ueber Strg-P oder das Menue -- deshalb haengt die
// Umrechnung am Ereignis, nicht am Knopf.
addEventListener("beforeprint", () => { druckt = true; zeichnen(); });
addEventListener("afterprint", () => { druckt = false; zeichnen(); });
document.getElementById("stand").textContent =
  DATEN.stand ? "Stand " + new Date(DATEN.stand).toLocaleDateString("de-DE") : "ohne Stand";
zeichnen();
</script>
</body>
</html>
